<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق وَريد - لنداءات الدم الطارئة</title>
    <!-- ربط Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ربط Socket.IO للاتصال الفوري -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">

    <!-- نافذة إطلاق نداء دم طارئ -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg p-6 relative shadow-2xl">
        
        <!-- العنوان -->
        <div class="flex items-center gap-2 mb-6 text-red-500">
            <span class="text-2xl">🚑</span>
            <h2 class="text-xl font-bold">إطلاق نداء دم طارئ</h2>
        </div>

        <!-- نموذج الإرسال مع ربط الحدث برمجياً لضمان الاستجابة -->
        <form id="emergencyForm" class="space-y-4">
            
            <!-- اسم المستشفى -->
            <div>
                <label class="block text-sm text-slate-400 mb-1">اسم المستشفى</label>
                <input type="text" id="hospital_name" name="hospital_name" placeholder="أدخل اسم المستشفى" required
                    class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-white focus:outline-none focus:border-red-600">
            </div>

            <!-- المنطقة والمحافظة -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-1">المنطقة</label>
                    <input type="text" id="region_input" name="region_input" placeholder="مثال: منطقة جازان" required
                        class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-white focus:outline-none focus:border-red-600">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">المحافظة</label>
                    <select id="region" name="region" required
                        class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-white focus:outline-none focus:border-red-600">
                        <option value="منطقة جازان">منطقة جازان</option>
                    </select>
                </div>
            </div>

            <!-- الفصيلة والاستعجال -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-1">الفصيلة</label>
                    <select id="blood_type" name="blood_type" required
                        class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-white focus:outline-none focus:border-red-600">
                        <option value="O-">O-</option>
                        <option value="O+">O+</option>
                        <option value="A-">A-</option>
                        <option value="A+">A+</option>
                        <option value="B-">B-</option>
                        <option value="B+">B+</option>
                        <option value="AB-">AB-</option>
                        <option value="AB+">AB+</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">الاستعجال</label>
                    <select id="urgency" name="urgency" required
                        class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-white focus:outline-none focus:border-red-600">
                        <option value="عاجل">عاجل</option>
                        <option value="حرج جداً">حرج جداً</option>
                    </select>
                </div>
            </div>

            <!-- رقم التواصل -->
            <div>
                <label class="block text-sm text-slate-400 mb-1">رقم التواصل</label>
                <input type="tel" id="phone" name="phone" placeholder="05xxxxxxxx" required
                    class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-white focus:outline-none focus:border-red-600">
            </div>

            <!-- زر الإرسال -->
            <button type="submit" id="submitBtn" 
                class="w-full bg-red-700 hover:bg-red-800 text-white p-3 rounded-lg font-bold transition duration-200 mt-4 cursor-pointer">
                نشر النداء
            </button>
        </form>
    </div>

    <!-- جافاسكريبت لمعالجة التفاعل وإرسال البيانات دون تعليق -->
    <script>
        // الاتصال بـ Socket.IO
        const socket = io();

        document.getElementById('emergencyForm').addEventListener('submit', function(event) {
            event.preventDefault(); // منع إعادة تحميل الصفحة الافتراضي

            // جمع بيانات النموذج
            const formData = {
                hospital_name: document.getElementById('hospital_name').value,
                region: document.getElementById('region').value,
                region_input: document.getElementById('region_input').value,
                urgency: document.getElementById('urgency').value,
                blood_type: document.getElementById('blood_type').value,
                phone: document.getElementById('phone').value
            };

            // إرسال البيانات عبر Socket.IO للخادم
            socket.emit('new_emergency', formData);

            // رسالة تأكيد مؤقتة أو تصفير النموذج
            alert('تم إرسال النداء بنجاح!');
            this.reset();
        });
    </script>
</body>
</html>
